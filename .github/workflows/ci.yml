name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_placeholder"
  AUTH_SECRET: "ci-placeholder-secret-not-for-real-use"
  NEXT_PUBLIC_STORAGE_BACKEND: "local"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
